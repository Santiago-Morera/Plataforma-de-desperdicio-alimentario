<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FoodRescue Hub - MVP</title>
    <!-- Tailwind CSS para el diseño impecable -->
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-gray-50 text-gray-800 font-sans min-h-screen">
    
    <!-- Header -->
    <header class="bg-emerald-600 text-white p-4 shadow-md">
      <div class="max-w-5xl mx-auto flex justify-between items-center">
        <h1 class="text-xl font-bold flex items-center gap-2">🍲 FoodRescue Hub</h1>
        <span class="bg-emerald-700 text-xs px-3 py-1 rounded-full uppercase tracking-wider font-semibold">MVP Panel</span>
      </div>
    </header>

    <main class="max-w-5xl mx-auto p-6 grid grid-cols-1 md:grid-cols-3 gap-6">
      <!-- Formulario para agregar excedentes -->
      <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100 h-fit">
        <h2 class="text-lg font-bold mb-4 text-emerald-700">Registrar Excedente</h2>
        <form id="foodForm" class="space-y-4">
          <div>
            <label class="block text-sm font-medium text-gray-600">Nombre del Alimento</label>
            <input 
              type="text" 
              id="producto"
              required
              placeholder="Ej. Tomates Orgánicos" 
              class="mt-1 block w-full p-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-emerald-500 focus:border-emerald-500"
            />
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-600">Cantidad / Peso</label>
            <input 
              type="text" 
              id="cantidad"
              required
              placeholder="Ej. 15 Kg" 
              class="mt-1 block w-full p-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-emerald-500 focus:border-emerald-500"
            />
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-600">Categoría</label>
            <select 
              id="tipo"
              class="mt-1 block w-full p-2 border border-gray-300 bg-white rounded-md shadow-sm focus:outline-none focus:ring-emerald-500 focus:border-emerald-500"
            >
              <option>Frutas/Verduras</option>
              <option>Panadería</option>
              <option>Lácteos</option>
              <option>Abarrotes</option>
            </select>
          </div>
          <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-medium py-2 rounded-md transition-colors shadow-sm">
            Publicar Donación
          </button>
        </form>
      </div>

      <!-- Lista de donaciones interactiva -->
      <div class="md:col-span-2 bg-white p-6 rounded-xl shadow-sm border border-gray-100">
        <h2 class="text-lg font-bold mb-4 text-gray-700 flex justify-between items-center">
          <span>Donaciones en Tiempo Real</span>
          <span id="totalItems" class="text-xs font-normal text-gray-500">Total: 3 items</span>
        </h2>

        <div id="listaDonaciones" class="space-y-3">
          <!-- Los elementos se cargan dinámicamente aquí -->
        </div>
      </div>
    </main>

    <!-- Lógica de interacciones dinámica -->
    <script>
      // Datos iniciales de ejemplo
      let donaciones = [
        { id: 1, producto: "Tomates Orgánicos", cantidad: "15 Kg", estado: "Disponible", tipo: "Frutas/Verduras" },
        { id: 2, producto: "Pan Artesanal", cantidad: "20 Unidades", estado: "Entregado", tipo: "Panadería" },
        { id: 3, producto: "Lácteos Varios", cantidad: "10 Litros", estado: "Disponible", tipo: "Lácteos" }
      ];

      const listaContainer = document.getElementById('listaDonaciones');
      const totalItemsSpan = document.getElementById('totalItems');
      const form = document.getElementById('foodForm');

      // Función para pintar la lista en pantalla
      function renderizarLista() {
        listaContainer.innerHTML = '';
        totalItemsSpan.textContent = `Total: ${donaciones.length} items`;

        donaciones.forEach(don => {
          const itemHtml = `
            <div class="p-4 border border-gray-100 rounded-lg bg-gray-50 flex justify-between items-center hover:shadow-sm transition-shadow">
              <div>
                <div class="flex items-center gap-2">
                  <h3 class="font-semibold text-gray-800">${don.producto}</h3>
                  <span class="text-xs bg-emerald-100 text-emerald-800 px-2 py-0.5 rounded-md font-medium">${don.tipo}</span>
                </div>
                <p class="text-sm text-gray-500 mt-1">Cantidad disponible: <span class="font-medium text-gray-700">${don.cantidad}</span></p>
              </div>
              <div class="flex items-center gap-3">
                <span class="px-2.5 py-1 rounded-full text-xs font-semibold ${don.estado === 'Disponible' ? 'bg-amber-100 text-amber-800' : 'bg-blue-100 text-blue-800'}">
                  ${don.estado}
                </span>
                <button 
                  onclick="cambiarEstado(${don.id})" 
                  class="text-xs bg-gray-200 hover:bg-gray-300 text-gray-700 py-1.5 px-3 rounded-md transition-colors"
                >
                  ${don.estado === 'Disponible' ? 'Marcar Entregado' : 'Reabrir'}
                </button>
              </div>
            </div>
          `;
          listaContainer.insertAdjacentHTML('beforeend', itemHtml);
        });
      }

      // Cambiar estado de Disponible a Entregado
      window.cambiarEstado = function(id) {
        donaciones = donaciones.map(don => {
          if (don.id === id) {
            return { ...don, estado: don.estado === 'Disponible' ? 'Entregado' : 'Disponible' };
          }
          return don;
        });
        renderizarLista();
      };

      // Manejar el registro de nuevos alimentos
      form.addEventListener('submit', (e) => {
        e.preventDefault();
        const productoInput = document.getElementById('producto');
        const cantidadInput = document.getElementById('cantidad');
        const tipoInput = document.getElementById('tipo');

        const nuevaDonacion = {
          id: Date.now(),
          producto: productoInput.value,
          cantidad: cantidadInput.value,
          tipo: tipoInput.value,
          estado: "Disponible"
        };

        donaciones.unshift(nuevaDonacion);
        renderizarLista();

        // Limpiar el formulario
        productoInput.value = '';
        cantidadInput.value = '';
      });

      // Cargar lista por primera vez al abrir la web
      renderizarLista();
    </script>
  </body>
</html>
