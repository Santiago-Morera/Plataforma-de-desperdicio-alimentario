<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FoodRescue Hub - MVP</title>
    <!-- Tailwind CSS para el diseño -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Scripts de React para que funcione directamente en el navegador sin romperse -->
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <!-- Babel para que el navegador entienda el código JSX de React -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  </head>
  <body>
    
    <div id="root"></div>

    <!-- Cargamos tu componente App.jsx y lo montamos en el DOM real -->
    <script type="text/babel" src="/src/App.jsx"></script>
    
    <script type="text/babel">
      // Esperamos a que tu componente App se cargue y lo renderizamos en el id="root"
      setTimeout(() => {
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
      }, 500);
    </script>

  </body>
</html>
